}
.btn-icon:hover {

  color: #38bdf8;
  border-color: #38bdf8;

/* Layout */
.layout {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2vw;
  padding: 2vh 2vw;
  position: relative;
  overflow: hidden;
}

/* 3D Stage & Tilt */
.stage {
  height: min(84vh, 52vw);
  aspect-ratio: 1;
  flex: none;
  perspective: 1200px;
  position: relative;
}
.tilt {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.3s ease-out;
  will-change: transform;
}
.layer {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}
#ring {
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  will-change: transform;
}
#ring svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

/* Wheel Sector Pop */
.wheel-sector {
  cursor: pointer;
  transform-origin: 0px 0px;
  transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.25, 1.25), filter 0.28s ease;
}
.wheel-sector:hover, .wheel-sector.on {
  transform: scale(1.05) translateZ(40px);
  filter: drop-shadow(0 16px 24px rgba(0,0,0,0.8)) drop-shadow(0 0 22px var(--glow, rgba(120,205,255,0.95)));
}

/* Center Hub Layer */
#hub-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translateZ(28px);
}
.hub-center {
  width: 33%;
  height: 33%;
  border-radius: 50%;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 14px;
  pointer-events: auto;
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.hub-center:hover {
  transform: scale(1.035);
  box-shadow: 0 0 40px rgba(14, 165, 233, 0.75), inset 0 0 26px rgba(14, 165, 233, 0.45);
}
.hub-kicker {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #7dd3fc;
}
.hub-title {

  color: #ffffff;

.hub-sub {

  font-weight: 600;
  color: #94a3b8;

.hub-badge {

  font-weight: 700;

  border: 1px solid rgba(14, 165, 233, 0.45);

  border-radius: 12px;

.panel {

}
.panel.show { display: block; }
@keyframes slideIn {
  from { opacity: 0; transform: translateX(30px); }

.close-btn {

function polarToCartesian(r, angleRad) {
  return { x: r * Math.sin(angleRad), y: -r * Math.cos(angleRad) };
}

function sectorPath(r1, r2, a1, a2) {
  const p1 = polarToCartesian(r2, a1);
  const p2 = polarToCartesian(r2, a2);
  const p3 = polarToCartesian(r1, a2);
  const p4 = polarToCartesian(r1, a1);
  const largeArc = (a2 - a1) > Math.PI ? 1 : 0;
  return 'M ' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2) +
         ' A ' + r2 + ' ' + r2 + ' 0 ' + largeArc + ' 1 ' + p2.x.toFixed(2) + ' ' + p2.y.toFixed(2) +
         ' L ' + p3.x.toFixed(2) + ' ' + p3.y.toFixed(2) +
         ' A ' + r1 + ' ' + r1 + ' 0 ' + largeArc + ' 0 ' + p4.x.toFixed(2) + ' ' + p4.y.toFixed(2) +
         ' Z';
}

function renderWheel() {
  const items = getItemsForMode();
  N = items.length;
  STEP = 360 / N;
  selected = -1;

  const R_OUTER_2 = 475, R_OUTER_1 = 300;
  const R_INNER_2 = 292, R_INNER_1 = 185;

  let defs = '<defs>' +

    '</filter>';

  items.forEach((item, i) => {
    defs += 
      '<linearGradient id="grad-outer-' + i + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
        '<stop offset="0%" stop-color="' + item.color + '" stop-opacity="0.88" />' +
        '<stop offset="100%" stop-color="#0a2547" stop-opacity="0.95" />' +
      '</linearGradient>' +
      '<linearGradient id="grad-inner-' + i + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
        '<stop offset="0%" stop-color="' + item.color + '" stop-opacity="0.45" />' +
        '<stop offset="100%" stop-color="#061a38" stop-opacity="0.8" />' +
      '</linearGradient>';
  });
  defs += '</defs>';

  let content = defs;

  // Background guide rings
  content += 
    '<circle cx="0" cy="0" r="478" fill="none" stroke="rgba(120, 190, 240, 0.15)" stroke-width="1.5" stroke-dasharray="4 6" />' +
    '<circle cx="0" cy="0" r="296" fill="none" stroke="rgba(120, 190, 240, 0.25)" stroke-width="1" />' +
    '<circle cx="0" cy="0" r="180" fill="none" stroke="rgba(120, 190, 240, 0.35)" stroke-width="1.5" />';

  // Sectors
  items.forEach((item, i) => {
    const mid = i * stepRad;
    const a1 = mid - (stepRad / 2) + (gapRad / 2);
    const a2 = mid + (stepRad / 2) - (gapRad / 2);
    const deg = (i * STEP).toFixed(3);

    const dOuter = sectorPath(R_OUTER_1, R_OUTER_2, a1, a2);
    const dInner = sectorPath(R_INNER_1, R_INNER_2, a1, a2);

    const fontSizeTitle = N === 9 ? 12 : 10;
    const fontSizeSub = N === 9 ? 10.5 : 9;

    content += 
      '<g class="wheel-sector" id="sector-' + i + '" data-i="' + i + '" style="--glow: ' + item.color + ';">' +
        '<!-- Outer Segment -->' +
        '<path d="' + dOuter + '" fill="url(#grad-outer-' + i + ')" stroke="' + item.color + '" stroke-width="2" />' +
        '<!-- Inner Segment -->' +
        '<path d="' + dInner + '" fill="url(#grad-inner-' + i + ')" stroke="' + item.color + '" stroke-width="1" stroke-opacity="0.7" />' +
        '<!-- Labels oriented relative to sector angle -->' +
        '<g transform="rotate(' + deg + ')">' +
          '<text x="0" y="-420" text-anchor="middle" font-size="15" fill="#ffffff">' + item.icon + '</text>' +
          '<text x="0" y="-396" text-anchor="middle" font-size="' + fontSizeTitle + '" font-weight="900" fill="#ffffff" letter-spacing="0.04em">' + item.short + '</text>' +
          '<rect x="-42" y="-380" width="84" height="17" rx="8.5" fill="' + item.color + '33" stroke="' + item.color + '88" stroke-width="1" />' +

          '<text x="0" y="-246" text-anchor="middle" font-size="' + fontSizeSub + '" font-weight="800" fill="#f8fafc">' + item.sub1 + '</text>' +
          '<text x="0" y="-228" text-anchor="middle" font-size="9" font-weight="600" fill="#94a3b8">' + item.sub2 + '</text>' +
        '</g>' +
      '</g>';
  });

  svg.innerHTML = content;

  // Re-attach sector interaction events
  document.querySelectorAll('.wheel-sector').forEach(sec => {
    const i = +sec.dataset.i;
    sec.addEventListener('mouseenter', () => { hoverPause = true; hover(i, true); });
    sec.addEventListener('mouseleave', () => { hoverPause = false; hover(i, false); });
    sec.addEventListener('click', () => show(i));
  });
}

/* Rotation Engine */
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (tween) {
    const t = Math.min(1, (now - tween.t0) / tween.dur);
    const e = 1 - Math.pow(1 - t, 3);
    angle = tween.from + tween.delta * e;
    if (t >= 1) tween = null;
  } else if (!hoverPause && !panelOpen && isSpinning) {
    angle = (angle + SPEED * dt) % 360;
  }
  ring.style.transform = 'rotate(' + angle.toFixed(3) + 'deg)';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function spinTo(i) {
  const target = ((-i * STEP) % 360 + 360) % 360;
  let delta = ((target - angle) % 360 + 360) % 360;
  if (delta < 25) delta += 360;
  tween = { from: angle, delta: delta, t0: performance.now(), dur: 900 + delta * 3.5 };
}

function setOn(i, on) {
  const el = document.getElementById('sector-' + i);
  if (el) el.classList.toggle('on', on);
}

function hover(i, on) {
  if (i === selected) { setOn(i, true); return; }
  setOn(i, on);
  if (on) {
    const items = getItemsForMode();
    const it = items[i];
    if (it) {
      document.getElementById('hub-kicker').textContent = it.icon + ' ' + it.id.toUpperCase();
      document.getElementById('hub-title').textContent = it.name.split('—')[0].split(':')[0];
      document.getElementById('hub-badge').textContent = it.badge;
    }
  } else {
    resetHubText();
  }
}

    html += '</ul></div>';

    // Activities
    html += '<div class="panel-sec"><h3>Strategic Activities &amp; Governance</h3><ul class="item-list activities">';
    item.members.forEach(m => {
      (m.act || []).forEach(a => {
        html += '<li style="--item-accent: ' + item.color + '">' + esc(a) + '</li>';
      });
    });
    html += '</ul></div>';

  } else {
    // Individual Member Mode
    const m = item.members[0];
    const cl = CLUSTERS.find(c => c.id === m.cluster) || { name: m.cluster, color: "#0ea5e9" };

    html += 
      '<div class="panel-header">' +
        '<span class="panel-cluster-chip" style="background:' + cl.color + '26;color:' + cl.color + ';border:1px solid ' + cl.color + '55;">' +
          esc(cl.name) +
        '</span>' +
        '<h2>' + esc(m.name) + '</h2>' +
        '<div class="tag">' + esc(m.role) + '</div>' +
      '</div>';

    // Overview Card
    html += 
      '<div class="member-card" style="margin-top:12px;">' +
        '<div class="m-name"><span>Period</span><span class="m-period">' + esc(m.period) + '</span></div>' +
        '<div class="m-stake" style="margin-top:8px;"><b>Key Stakeholders:</b> ' + esc(m.stake) + '</div>' +
      '</div>';

    // Solutions
    html += '<div class="panel-sec"><h3>Structured Solutions (' + (m.sol||[]).length + ')</h3><ul class="item-list solutions">';
    (m.sol || []).forEach(s => {
      const parts = s.split(':');
      if (parts.length > 1) {
        html += '<li style="--item-accent: ' + cl.color + '"><b>' + esc(parts[0].trim()) + '</b>' + esc(parts.slice(1).join(':').trim()) + '</li>';
      } else {
        html += '<li style="--item-accent: ' + cl.color + '">' + esc(s) + '</li>';
      }
    });
    html += '</ul></div>';

    // Activities
    html += '<div class="panel-sec"><h3>Strategic Activities (' + (m.act||[]).length + ')</h3><ul class="item-list activities">';
    (m.act || []).forEach(a => {
      html += '<li style="--item-accent: ' + cl.color + '">' + esc(a) + '</li>';
    });
    html += '</ul></div>';
  }

  panel.innerHTML = html;
  panel.classList.add('show');
  panel.scrollTop = 0;
}

function hide() {
  panel.classList.remove('show');
  panelOpen = false;
  if (selected >= 0) {
    setOn(selected, false);
    selected = -1;
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });

function switchMode(mode) {
  if (currentMode === mode) return;
  currentMode = mode;
  document.getElementById('btn-mode-clusters').classList.toggle('active', mode === 'clusters');
  document.getElementById('btn-mode-members').classList.toggle('active', mode === 'members');
  hide();
  resetHubText();
  renderWheel();
}

function toggleSpin() {
  isSpinning = !isSpinning;
  document.getElementById('btn-spin-toggle').textContent = isSpinning ? "⏸" : "▶";
  document.getElementById('btn-spin-toggle').title = isSpinning ? "Pause Rotation" : "Resume Rotation";
}

/* 3D Tilt Interaction */
stage.addEventListener('mousemove', e => {
  const r = stage.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;
  const y = (e.clientY - r.top) / r.height - 0.5;
  tilt.style.transform = 'rotateX(' + (y * 14).toFixed(2) + 'deg) rotateY(' + (-x * 14).toFixed(2) + 'deg) scale(1.03)';
});
stage.addEventListener('mouseleave', () => {
  tilt.style.transform = '';
});

// Initialize
renderWheel();
resetHubText();
</script>
</body>
</html>
